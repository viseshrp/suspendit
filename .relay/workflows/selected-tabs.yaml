{
  "version": 1,
  "name": "SuspendIt selected tabs \u2014 canonical ten-phase workflow",
  "inputs": {
    "task": {
      "type": "string",
      "required": true
    }
  },
  "nodes": {
    "explore": {
      "type": "agent",
      "writes": true,
      "allow_no_commit": true,
      "agents": [
        "codex"
      ],
      "model": "gpt-6-luna",
      "permission_profile": "interactive",
      "prompts": [
        {
          "local": "prompts/source/01_initial_exploration_any_model.md"
        }
      ],
      "outputs": {
        "draft_plan": {
          "label": {
            "artifact": "DRAFT_PLAN.md",
            "label": "Created by"
          }
        },
        "initial_opus_planning_prompt": {
          "label": {
            "artifact": "INITIAL_OPUS_PLANNING_PROMPT.md",
            "label": "Created by"
          }
        }
      }
    },
    "explore_artifacts": {
      "type": "command",
      "needs": [
        "explore"
      ],
      "writes": true,
      "allow_no_commit": true,
      "run": [
        "python3",
        "-c",
        "from pathlib import Path; import sys; paths=['DRAFT_PLAN.md', 'INITIAL_OPUS_PLANNING_PROMPT.md']; missing=[p for p in paths if not Path(p).is_file() or not Path(p).read_text(encoding=\"utf-8\").strip()]; print(\"Required artifacts missing or empty:\", missing) if missing else print(\"Required artifacts present:\", paths); sys.exit(1 if missing else 0)"
      ]
    },
    "plan": {
      "type": "agent",
      "writes": true,
      "allow_no_commit": true,
      "agents": [
        "claude"
      ],
      "model": "opus",
      "permission_profile": "interactive",
      "prompts": [
        {
          "local": "prompts/handoffs/plan.txt"
        }
      ],
      "outputs": {
        "feature_spec_and_plan": {
          "label": {
            "artifact": "FEATURE_SPEC_AND_PLAN.md",
            "label": "Created by"
          }
        },
        "execution_prompt": {
          "label": {
            "artifact": "EXECUTION_PROMPT.md",
            "label": "Created by"
          }
        }
      },
      "needs": [
        "explore_artifacts"
      ]
    },
    "plan_artifacts": {
      "type": "command",
      "needs": [
        "plan"
      ],
      "writes": true,
      "allow_no_commit": true,
      "run": [
        "python3",
        "-c",
        "from pathlib import Path; import sys; paths=['FEATURE_SPEC_AND_PLAN.md', 'EXECUTION_PROMPT.md']; missing=[p for p in paths if not Path(p).is_file() or not Path(p).read_text(encoding=\"utf-8\").strip()]; print(\"Required artifacts missing or empty:\", missing) if missing else print(\"Required artifacts present:\", paths); sys.exit(1 if missing else 0)"
      ]
    },
    "critique": {
      "type": "agent",
      "writes": true,
      "allow_no_commit": true,
      "agents": [
        "antigravity"
      ],
      "model": "gemini-3.8-flash-low",
      "permission_profile": "auto_approve",
      "prompts": [
        {
          "local": "prompts/source/02_plan_critique_any_model.md"
        }
      ],
      "outputs": {
        "plan_critique": {
          "label": {
            "artifact": "PLAN_CRITIQUE.md",
            "label": "Created by"
          }
        },
        "opus_plan_revision_request": {
          "label": {
            "artifact": "OPUS_PLAN_REVISION_REQUEST.md",
            "label": "Created by"
          }
        }
      },
      "needs": [
        "plan_artifacts"
      ]
    },
    "critique_artifacts": {
      "type": "command",
      "needs": [
        "critique"
      ],
      "writes": true,
      "allow_no_commit": true,
      "run": [
        "python3",
        "-c",
        "from pathlib import Path; import sys; paths=['PLAN_CRITIQUE.md', 'OPUS_PLAN_REVISION_REQUEST.md']; missing=[p for p in paths if not Path(p).is_file() or not Path(p).read_text(encoding=\"utf-8\").strip()]; print(\"Required artifacts missing or empty:\", missing) if missing else print(\"Required artifacts present:\", paths); sys.exit(1 if missing else 0)"
      ]
    },
    "revise": {
      "type": "agent",
      "writes": true,
      "allow_no_commit": true,
      "agents": [
        "claude"
      ],
      "model": "opus",
      "permission_profile": "interactive",
      "prompts": [
        {
          "local": "prompts/handoffs/revise.txt"
        }
      ],
      "outputs": {
        "plan_revision_summary": {
          "label": {
            "artifact": "PLAN_REVISION_SUMMARY.md",
            "label": "Created by"
          }
        }
      },
      "needs": [
        "critique_artifacts"
      ]
    },
    "revise_artifacts": {
      "type": "command",
      "needs": [
        "revise"
      ],
      "writes": true,
      "allow_no_commit": true,
      "run": [
        "python3",
        "-c",
        "from pathlib import Path; import sys; paths=['PLAN_REVISION_SUMMARY.md']; missing=[p for p in paths if not Path(p).is_file() or not Path(p).read_text(encoding=\"utf-8\").strip()]; print(\"Required artifacts missing or empty:\", missing) if missing else print(\"Required artifacts present:\", paths); sys.exit(1 if missing else 0)"
      ]
    },
    "verify_plan": {
      "type": "agent",
      "writes": true,
      "allow_no_commit": true,
      "agents": [
        "antigravity"
      ],
      "model": "gemini-3.8-flash-low",
      "permission_profile": "auto_approve",
      "prompts": [
        {
          "local": "prompts/source/03_plan_revision_verification_any_model.md"
        }
      ],
      "outputs": {
        "plan_revision_verification": {
          "label": {
            "artifact": "PLAN_REVISION_VERIFICATION.md",
            "label": "Created by"
          }
        }
      },
      "needs": [
        "revise_artifacts"
      ]
    },
    "verify_plan_artifacts": {
      "type": "command",
      "needs": [
        "verify_plan"
      ],
      "writes": true,
      "allow_no_commit": true,
      "run": [
        "python3",
        "-c",
        "from pathlib import Path; import sys; paths=['PLAN_REVISION_VERIFICATION.md']; missing=[p for p in paths if not Path(p).is_file() or not Path(p).read_text(encoding=\"utf-8\").strip()]; print(\"Required artifacts missing or empty:\", missing) if missing else print(\"Required artifacts present:\", paths); sys.exit(1 if missing else 0)"
      ]
    },
    "plan_checkpoint": {
      "type": "command",
      "needs": [
        "verify_plan_artifacts"
      ],
      "writes": true,
      "allow_no_commit": true,
      "run": [
        "python3",
        ".relay/scripts/verify-verdict.py",
        "PLAN_REVISION_VERIFICATION.md",
        "All previous concerns resolved",
        "Documentation checkpoints complete",
        "Ready for implementation"
      ]
    },
    "implement": {
      "type": "agent",
      "writes": true,
      "allow_no_commit": true,
      "agents": [
        "codex"
      ],
      "model": "gpt-6-luna",
      "permission_profile": "interactive",
      "prompts": [
        {
          "local": "prompts/handoffs/implement.txt"
        }
      ],
      "outputs": {},
      "needs": [
        "plan_checkpoint"
      ]
    },
    "review": {
      "type": "agent",
      "writes": true,
      "allow_no_commit": true,
      "agents": [
        "claude"
      ],
      "model": "opus",
      "permission_profile": "interactive",
      "prompts": [
        {
          "local": "prompts/source/04_opus_review_branch.md"
        }
      ],
      "outputs": {
        "review": {
          "label": {
            "artifact": "REVIEW.md",
            "label": "Created by"
          }
        },
        "walkthrough": {
          "label": {
            "artifact": "WALKTHROUGH.md",
            "label": "Created by"
          }
        },
        "review_fix_prompt": {
          "label": {
            "artifact": "REVIEW_FIX_PROMPT.md",
            "label": "Created by"
          }
        }
      },
      "needs": [
        "implement"
      ]
    },
    "review_artifacts": {
      "type": "command",
      "needs": [
        "review"
      ],
      "writes": true,
      "allow_no_commit": true,
      "run": [
        "python3",
        "-c",
        "from pathlib import Path; import sys; paths=['REVIEW.md', 'WALKTHROUGH.md', 'REVIEW_FIX_PROMPT.md']; missing=[p for p in paths if not Path(p).is_file() or not Path(p).read_text(encoding=\"utf-8\").strip()]; print(\"Required artifacts missing or empty:\", missing) if missing else print(\"Required artifacts present:\", paths); sys.exit(1 if missing else 0)"
      ]
    },
    "review_checkpoint": {
      "type": "human_wait",
      "needs": [
        "review_artifacts"
      ],
      "prompt": "Operator must inspect the actual review findings and obtain owner decisions required by REVIEW_FIX_PROMPT.md before advancing to fixes."
    },
    "fix": {
      "type": "agent",
      "writes": true,
      "allow_no_commit": true,
      "agents": [
        "codex"
      ],
      "model": "gpt-6-luna",
      "permission_profile": "interactive",
      "prompts": [
        {
          "local": "prompts/handoffs/fix.txt"
        }
      ],
      "outputs": {},
      "needs": [
        "review_checkpoint"
      ]
    },
    "verify_fixes": {
      "type": "agent",
      "writes": true,
      "allow_no_commit": true,
      "agents": [
        "claude"
      ],
      "model": "opus",
      "permission_profile": "interactive",
      "prompts": [
        {
          "local": "prompts/source/05_opus_verify_review_fixes.md"
        }
      ],
      "outputs": {
        "review_fix_verification": {
          "label": {
            "artifact": "REVIEW_FIX_VERIFICATION.md",
            "label": "Created by"
          }
        }
      },
      "needs": [
        "fix"
      ]
    },
    "verify_fixes_artifacts": {
      "type": "command",
      "needs": [
        "verify_fixes"
      ],
      "writes": true,
      "allow_no_commit": true,
      "run": [
        "python3",
        "-c",
        "from pathlib import Path; import sys; paths=['REVIEW_FIX_VERIFICATION.md']; missing=[p for p in paths if not Path(p).is_file() or not Path(p).read_text(encoding=\"utf-8\").strip()]; print(\"Required artifacts missing or empty:\", missing) if missing else print(\"Required artifacts present:\", paths); sys.exit(1 if missing else 0)"
      ]
    },
    "verification_checkpoint": {
      "type": "command",
      "needs": [
        "verify_fixes_artifacts"
      ],
      "writes": true,
      "allow_no_commit": true,
      "run": [
        "python3",
        ".relay/scripts/verify-verdict.py",
        "REVIEW_FIX_VERIFICATION.md",
        "All valid blocking and non-blocking review findings resolved",
        "Documentation checkpoints complete",
        "Ready to finalize review/walkthrough docs"
      ]
    },
    "refresh": {
      "type": "agent",
      "writes": true,
      "allow_no_commit": true,
      "agents": [
        "claude"
      ],
      "model": "opus",
      "permission_profile": "interactive",
      "prompts": [
        {
          "local": "prompts/source/06_opus_refresh_review_and_walkthrough.md"
        }
      ],
      "outputs": {
        "review": {
          "label": {
            "artifact": "REVIEW.md",
            "label": "Created by"
          }
        },
        "walkthrough": {
          "label": {
            "artifact": "WALKTHROUGH.md",
            "label": "Created by"
          }
        }
      },
      "needs": [
        "verification_checkpoint"
      ]
    },
    "human_walkthrough": {
      "type": "human_wait",
      "needs": [
        "refresh"
      ],
      "prompt": "Owner must complete phase 07 human review using the canonical prompt. Do not treat implementation authorization as RESOLVE or AGREE. Approved follow-up work must complete phase 08 before advancing to tests."
    },
    "tests": {
      "type": "agent",
      "writes": true,
      "allow_no_commit": true,
      "agents": [
        "codex"
      ],
      "model": "gpt-6-luna",
      "permission_profile": "interactive",
      "prompts": [
        {
          "local": "prompts/source/09_write_focused_tests_any_model.md"
        }
      ],
      "outputs": {},
      "needs": [
        "human_walkthrough"
      ]
    },
    "test_audit": {
      "type": "agent",
      "writes": true,
      "allow_no_commit": true,
      "agents": [
        "antigravity"
      ],
      "model": "gemini-3.8-flash-low",
      "permission_profile": "auto_approve",
      "prompts": [
        {
          "local": "prompts/source/10_test_audit_any_model.md"
        }
      ],
      "outputs": {
        "test_audit": {
          "label": {
            "artifact": "TEST_AUDIT.md",
            "label": "Created by"
          }
        }
      },
      "needs": [
        "tests"
      ]
    },
    "test_audit_artifacts": {
      "type": "command",
      "needs": [
        "test_audit"
      ],
      "writes": true,
      "allow_no_commit": true,
      "run": [
        "python3",
        "-c",
        "from pathlib import Path; import sys; paths=['TEST_AUDIT.md']; missing=[p for p in paths if not Path(p).is_file() or not Path(p).read_text(encoding=\"utf-8\").strip()]; print(\"Required artifacts missing or empty:\", missing) if missing else print(\"Required artifacts present:\", paths); sys.exit(1 if missing else 0)"
      ]
    },
    "human_test_review": {
      "type": "human_wait",
      "needs": [
        "test_audit_artifacts"
      ],
      "prompt": "Owner must review the audited test diff after phase 10 passes. Unresolved audit findings block completion."
    }
  }
}
