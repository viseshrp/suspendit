<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>SuspendIt</title>
		<link rel="stylesheet" href="../shared/theme.css" />
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<header class="popup-header">
			<img src="/icon/48.png" width="38" height="38" alt="" />
			<div class="brand"><h1>SuspendIt</h1><p>Free up memory. Keep your tabs.</p></div>
			<span class="native-label">ON DEMAND</span>
		</header>
		<main>
			<div class="controls">
			<section class="overview" aria-label="Tab overview">
				<div class="overview-top"><p id="counts">Reading your tabs…</p><span class="sleep-mark" aria-hidden="true">☾</span></div>
				<button id="suspend-window" class="primary" type="button" disabled>Suspend this window</button>
				<button id="suspend-all" class="all-button" type="button" disabled>Suspend all windows</button>
			</section>
			<div class="search-box">
				<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
				<label class="sr-only" for="search">Find a tab or group</label>
				<input id="search" type="search" placeholder="Find a tab or group…" autocomplete="off" spellcheck="false" />
			</div>
			</div>
			<div id="tab-list" class="tab-list" role="region" aria-label="Windows and tabs" tabindex="0">
				<div id="windows" class="windows"></div>
				<p id="empty" class="empty" hidden>No matching tabs.</p>
			</div>
		</main>
		<footer>
			<p id="status" role="status" aria-live="polite">Select a suspended tab to load it again.</p>
			<p class="protection">Bulk actions keep active, pinned, and audio tabs awake.</p>
		</footer>
		<template id="window-template">
			<section class="window">
				<div class="window-heading">
					<button type="button" class="window-toggle" data-action="toggle"><span class="chevron" aria-hidden="true">›</span><span class="window-name"></span><span class="window-count"></span></button>
					<button type="button" class="scope-button" data-action="window">Suspend</button>
				</div>
				<div class="window-tabs"></div>
			</section>
		</template>
		<template id="group-template">
			<section class="group">
				<div class="group-heading">
					<button type="button" class="group-toggle" data-action="toggle-group"><span class="chevron" aria-hidden="true">›</span><span class="group-dot" aria-hidden="true"></span><span class="group-name"></span><span class="group-count"></span></button>
					<button type="button" class="scope-button" data-action="group">Suspend</button>
				</div>
				<div class="group-tabs"></div>
			</section>
		</template>
		<template id="tab-template">
			<div class="tab-row">
				<span class="tab-mark" aria-hidden="true"></span>
				<button type="button" class="tab-link" data-action="open"><span class="tab-title"></span><span class="tab-meta"></span></button>
				<button type="button" class="tab-suspend" data-action="tab"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13.2A8.5 8.5 0 0 1 10.8 3.5 8.5 8.5 0 1 0 20.5 13.2Z"/></svg></button>
			</div>
		</template>
		<script type="module" src="./index.ts"></script>
	</body>
</html>
