<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="referrer" content="no-referrer" />
		<title>Tab suspended · SuspendIt</title>
		<link rel="icon" href="/icon/icon.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="../shared/theme.css" />
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<header><img src="/icon/icon.svg" width="28" height="28" alt="" /><span>SuspendIt</span></header>
		<main>
			<div class="moon" aria-hidden="true"><img src="/icon/icon.svg" width="112" height="112" alt="" /></div>
			<p class="eyebrow">TAB SUSPENDED</p>
			<h1>A little room to breathe.</h1>
			<p class="description">This page is unloaded. Bring it back when you need it.</p>
			<section class="page" aria-label="Suspended page">
				<h2 id="page-title">Your page</h2>
				<p id="page-address"></p>
			</section>
			<button id="resume" type="button" disabled>Resume page <span aria-hidden="true">↗</span></button>
			<p id="status" role="status">Your tab stays here until you’re ready.</p>
		</main>
		<footer>Less memory. Same place.</footer>
		<script type="module" src="./index.ts"></script>
	</body>
</html>
